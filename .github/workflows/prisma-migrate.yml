name: Database Migrations

on:
  push:
    branches:
      - main
    paths:
      - 'backend/prisma/**'
      - 'backend/package.json'
  workflow_dispatch:
    inputs:
      migration_name:
        description: 'Specific migration to run (optional)'
        required: false
        type: string

jobs:
  migrate:
    name: Run Database Migrations
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        working-directory: backend

      - name: Generate Prisma Client
        run: npx prisma generate
        working-directory: backend

      # prisma validate only checks schema syntax — it doesn't connect to the
      # database, but it does require DATABASE_URL to be defined in the env
      # because the schema references env("DATABASE_URL"). Use the real secret
      # if set, otherwise fall back to a syntactically valid placeholder so
      # schema validation always runs.
      - name: Validate Prisma Schema
        run: npx prisma validate
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://localhost:5432/validate_placeholder' }}

      - name: Check DATABASE_URL is configured
        id: db_check
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::DATABASE_URL secret is not set — skipping migration steps. Configure the secret in the production Environment to enable automatic migrations."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Run Database Migration
        if: steps.db_check.outputs.configured == 'true' && github.event.inputs.migration_name == ''
        run: npx prisma migrate deploy
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Run Specific Migration
        if: steps.db_check.outputs.configured == 'true' && github.event.inputs.migration_name != ''
        run: npx prisma migrate resolve --applied ${{ github.event.inputs.migration_name }}
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Report Migration Status
        if: steps.db_check.outputs.configured == 'true'
        run: npx prisma migrate status
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  rollback-check:
    name: Check Migration Status
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        working-directory: backend

      - name: Generate Prisma Client
        run: npx prisma generate
        working-directory: backend

      - name: Check DATABASE_URL is configured
        id: db_check
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::DATABASE_URL secret is not set — skipping migration status check."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Check Migration Status
        if: steps.db_check.outputs.configured == 'true'
        run: npx prisma migrate status
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  notification:
    name: Send Notification
    runs-on: ubuntu-latest
    needs: [migrate, rollback-check]
    if: always()

    steps:
      - name: Notify on Success
        if: needs.migrate.result == 'success'
        run: echo "Database migration completed successfully"

      - name: Notify on Failure
        if: needs.migrate.result == 'failure'
        run: |
          echo "Database migration failed. Please check the logs and rollback if needed."
          exit 1
