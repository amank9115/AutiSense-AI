name: Database Migrations

on:
  push:
    branches:
      - main
    paths:
      - 'backend/prisma/**'
      - 'backend/package.json'
  workflow_dispatch:
    inputs:
      migration_name:
        description: 'Specific migration to run (optional)'
        required: false
        type: string

jobs:
  migrate:
    name: Run Database Migrations
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: backend

      - name: Generate Prisma Client
        run: npx prisma generate
        working-directory: backend

      - name: Validate Prisma Schema
        run: npx prisma validate
        working-directory: backend

      - name: Run Database Migration
        if: github.event.inputs.migration_name == ''
        run: npx prisma migrate deploy
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Run Specific Migration
        if: github.event.inputs.migration_name != ''
        run: npx prisma migrate resolve --applied ${{ github.event.inputs.migration_name }}
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Generate Database Schema Documentation
        if: github.event.inputs.migration_name == ''
        run: npx prisma migrate status
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  rollback-check:
    name: Check Migration Status
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci
        working-directory: backend

      - name: Generate Prisma Client
        run: npx prisma generate
        working-directory: backend

      - name: Check Migration Status
        run: npx prisma migrate status
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  notification:
    name: Send Notification
    runs-on: ubuntu-latest
    needs: [migrate, rollback-check]
    if: always()

    steps:
      - name: Notify on Success
        if: needs.migrate.result == 'success'
        run: |
          echo "Database migration completed successfully"

      - name: Notify on Failure
        if: needs.migrate.result == 'failure'
        run: |
          echo "Database migration failed. Please check the logs and rollback if needed."
          exit 1