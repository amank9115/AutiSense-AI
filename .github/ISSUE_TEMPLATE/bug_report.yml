name: Bug Report
description: Report a reproducible bug in AutiSense AI
labels: [bug]
body:
  - type: input
    id: title
    attributes:
      label: Short description
      placeholder: e.g. "Screening session freezes after camera permission denied"
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      description: Where did you encounter this bug?
      options:
        - Production
        - Staging
        - Local development
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Click '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Paste any error messages, stack traces, or attach screenshots.
      render: shell

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Browser version, OS, service version, anything else useful.
