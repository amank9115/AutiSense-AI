name: Feature Request
description: Propose a new feature or improvement
labels: [enhancement]
body:
  - type: input
    id: title
    attributes:
      label: Feature title
      placeholder: e.g. "Export screening results as PDF"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What problem does this feature solve? Who is affected?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the feature you'd like to see.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What other approaches did you consider, and why did you rule them out?

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mockups, references, related issues, or anything else useful.
