# ──────────────────────────────────────────────────────────────────────────────
# AutiSense-AI — Local Development Stack
# ──────────────────────────────────────────────────────────────────────────────
# Usage:
#   docker compose up -d          → Start PostgreSQL, Redis, Ollama
#   docker compose down           → Stop everything
#   docker compose down -v        → Stop + delete volumes (wipes DB)
# ──────────────────────────────────────────────────────────────────────────────

version: "3.9"

services:
  # ── PostgreSQL with pgvector ───────────────────────────────────────────────
  postgres:
    image: ankane/pgvector:v0.5.1
    container_name: autisense-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: autisense
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis (for BullMQ) ─────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: autisense-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Ollama (Local AI Models — optional) ────────────────────────────────────
  # Only needed if using local LLM instead of Groq API
  # Start with: docker compose up ollama
  ollama:
    image: ollama/ollama:latest
    container_name: autisense-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    profiles:
      - local-ai

volumes:
  pgdata:
    driver: local
  redis_data:
    driver: local
  ollama_data:
    driver: local
